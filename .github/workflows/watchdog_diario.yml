name: Watchdog Reporte Diario

on:
  schedule:
    # Corre a las 12:30 UTC = 06:30 AM (Hora de México)
    # Damos 30 minutos de margen tras la ventana de las 6:00 AM
    - cron: '30 12 * * *'
  workflow_dispatch: # Permite dispararlo manualmente para pruebas

jobs:
  verificar_y_disparar:
    runs-on: ubuntu-latest
    # Permisos para que el GITHUB_TOKEN por defecto pueda disparar otro workflow
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Verificar si el reporte del día ya existe en Drive
        id: check
        env:
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          FECHA_HOY=$(TZ="America/Mexico_City" date +"%Y-%m-%d")
          echo "Buscando reporte para el día: $FECHA_HOY"
          
          URL="${GOOGLE_SCRIPT_URL}?action=leer&file=reporte_diocesano_vigente.json"
          REPORTE=$(curl -s "$URL")
          
          # Extraer el timestamp del reporte
          TIMESTAMP=$(echo "$REPORTE" | jq -r '.timestamp_iso_utc // empty')
          
          if [[ "$TIMESTAMP" == "$FECHA_HOY"* ]]; then
            echo "✅ El reporte del día ya existe (Timestamp: $TIMESTAMP). Watchdog no requiere acción."
            echo "requiere_accion=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Reporte NO encontrado para hoy (Último timestamp: $TIMESTAMP)."
            echo "requiere_accion=true" >> $GITHUB_OUTPUT
          fi

      - name: Disparar workflow principal (Red de seguridad)
        if: steps.check.outputs.requiere_accion == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Iniciando red de seguridad: disparando sara_cron.yml..."
          gh workflow run sara_cron.yml --ref main
          echo "✅ Workflow de emergencia disparado exitosamente."