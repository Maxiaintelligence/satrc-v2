<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Metadatos PWA y Apple iOS -->
    <title>SatRC V2.0 - Sistema de Alerta Temprana</title>
    <meta name="description" content="Sistema de Alerta Temprana y Riesgos Climáticos de Cáritas Pastoral Social • Arquidiócesis de Tulancingo" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SatRC V2" />
    
    <!-- Íconos y Manifiesto -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-slate-950 text-slate-100 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Registro automático del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
